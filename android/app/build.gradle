
plugins {
    id 'com.android.application'
}


def restdbProperties = new Properties()
def restdbLocalFile = rootProject.file('local.properties')

if (restdbLocalFile.exists()) {
    restdbLocalFile.withInputStream { stream ->
        restdbProperties.load(stream)
    }
}

def restdbBaseUrl = restdbProperties.getProperty(
        'restdb.url', 'https://example.restdb.io/'
).trim()

def restdbApiKey = restdbProperties.getProperty(
        'restdb.apiKey', ''
).trim()

if (!restdbBaseUrl.endsWith('/')) {
    restdbBaseUrl += '/'
}

if (!restdbBaseUrl.startsWith('https://')) {
    throw new GradleException('restdb.url must use HTTPS')
}

def javaString = { String value ->
    groovy.json.JsonOutput.toJson(value)
}

android {
    namespace 'pt.isep.dssmv.campuslf'
    compileSdk 35

    defaultConfig {
        applicationId 'pt.isep.dssmv.campuslf'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.4.0-c2-mvvm'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'String', 'RESTDB_BASE_URL',
                javaString(restdbBaseUrl)
        buildConfigField 'String', 'RESTDB_API_KEY',
                javaString(restdbApiKey)
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig.javaCompileOptions.annotationProcessorOptions {
        arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.room:room-rxjava3:2.8.5'

    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava3:3.0.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
}
